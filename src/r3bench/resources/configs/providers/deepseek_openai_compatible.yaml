adapter: openai_compatible
provider_name: deepseek_openai_compatible
base_url: https://api.deepseek.com
api_key_env: DEEPSEEK_API_KEY
transport_defaults:
  timeout_seconds: 1800
  max_retries: 2
  retry_backoff_seconds: 15.0
  retry_backoff_mode: fixed
  streaming: false
  request_safety_limits:
    require_explicit_cli_limit: true
default_headers: {}
extra_body: {}
