[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r3bench"
version = "0.9.0"
description = "Public evaluator for R3Bench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
network = ["requests>=2.31"]
data = ["huggingface_hub>=0.24"]
ar = ["reasoning-gym==0.1.25"]
test = ["pytest>=8"]
dev = ["pytest>=8", "build>=1.2", "twine>=5", "ruff>=0.6"]
all = [
  "requests>=2.31",
  "huggingface_hub>=0.24",
  "reasoning-gym==0.1.25",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["r3bench*"]

[tool.setuptools.package-data]
"r3bench.resources" = [
  "configs/**/*.json",
  "configs/**/*.yaml",
  "configs/**/*.yml",
  "configs/**/*.md",
  "examples/**/*",
  "prompts/**/*",
]

[project.scripts]
r3bench = "r3bench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
